<!doctype html><html><body style="margin:0;background:#888">
<canvas id="c" width="1600" height="800"></canvas>
<pre id="log"></pre><script>addEventListener("error",e=>log.textContent+="ERR "+e.message+"\n");addEventListener("unhandledrejection",e=>log.textContent+="REJ "+(e.reason&&e.reason.stack||e.reason)+"\n");</script><script type="module">
log.textContent+='module start\n';
import * as THREE from 'three';
import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/examples/jsm/libs/meshopt_decoder.module.js';
const renderer = new THREE.WebGLRenderer({ canvas: c, antialias: true, preserveDrawingBuffer: true });
renderer.setScissorTest(true);
log.textContent+='imports ok\n';
const loader = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
const [bike, rider] = await Promise.all(['/models/desert-bike.glb','/models/rider.glb'].map(u => loader.loadAsync(u, e => { log.textContent += u+' '+e.loaded+'\n'; }).then(g => { log.textContent += 'loaded '+u+'\n'; return g.scene; })));
const views = [[0,0,3.2,'front +z'],[3.2,0,0,'side +x'],[0,0,-3.2,'back -z'],[0,3.2,0.01,'top +y']];
const models = [bike, rider];
models.forEach((m, row) => {
  const scene = new THREE.Scene(); scene.background = new THREE.Color('#9aa');
  scene.add(new THREE.HemisphereLight('#fff','#666',2.5)); const d = new THREE.DirectionalLight('#fff',2); d.position.set(2,3,4); scene.add(d);
  scene.add(m); scene.add(new THREE.AxesHelper(1.3));
  views.forEach(([x,y,z], col) => {
    const cam = new THREE.PerspectiveCamera(40, 1, 0.1, 50); cam.position.set(x,y,z); cam.lookAt(0,0,0);
    renderer.setViewport(col*400, (1-row)*400, 400, 400); renderer.setScissor(col*400, (1-row)*400, 400, 400);
    renderer.render(scene, cam);
  });
});
log.textContent += 'done';
</script></body></html>
