<script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/addons/"}}</script></head><body>
<div id="stage"></div><aside><a href="./index.html?scene=roots-v1">Ride through the roots</a><h1>Woodland bike</h1><p>Matching day/night materials · one shared mesh<br>Drag to orbit. Scroll to zoom.</p><div><button data-view="front">Front</button><button data-view="side">Side</button><button data-view="back">Back</button></div><button id="look">Switch to night</button><button id="spin">Auto rotate</button><a href="./assets/models/roots-bike/bike.glb" download>Day GLB</a><a href="./assets/models/roots-bike-night/bike.glb" download>Night GLB</a><p id="status">Loading model…</p></aside><footer>Static bike mesh · wheels not separated or animated</footer>
<script type="module">
import * as THREE from 'three';
import {loadRootsBike} from './js/roots-bike.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#18252a');
const stage=document.querySelector('#stage');const camera=new THREE.PerspectiveCamera(38,stage.clientWidth/stage.clientHeight,.01,100);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(stage.clientWidth,stage.clientHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.2;stage.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.autoRotateSpeed=1.4;
scene.add(new THREE.HemisphereLight(0xffffff,0x687485,3));
for(const [x,y,z,power]of [[3,5,4,3],[-3,2,-3,2]]){const l=new THREE.DirectionalLight(0xffffff,power);l.position.set(x,y,z);scene.add(l)}
let distance=3,centerY=1;
function view(which){const positions={front:[0,.20,1],side:[1,.20,0],back:[0,.20,-1]};const p=positions[which];camera.position.set(p[0]*distance,centerY+p[1]*distance,p[2]*distance);controls.target.set(0,centerY,0);controls.update()}
const bikeMount=new THREE.Group();scene.add(bikeMount);
let bikeController=null, night=0, blend=null;
try {
 bikeController=await loadRootsBike(bikeMount,0);
 const box=new THREE.Box3().setFromObject(bikeMount), size=box.getSize(new THREE.Vector3());
 centerY=box.getCenter(new THREE.Vector3()).y;distance=Math.max(size.x,size.y,size.z)*1.8;
 camera.position.set(-2.5,1.7,-2.6);controls.target.set(0,centerY,0);controls.update();
 document.querySelector('#status').textContent='Ready · day look';window.modelReady=true;
} catch(e){document.querySelector('#status').textContent=e.message;console.error(e)}
document.querySelector('#look').onclick=()=>{
 if(!bikeController||blend)return;const next=night?0:1;
 if(matchMedia('(prefers-reduced-motion: reduce)').matches){night=next;bikeController.setNight(night)}
 else blend={start:performance.now(),from:night,to:next};
 document.querySelector('#look').textContent=next?'Switch to day':'Switch to night';
 document.querySelector('#status').textContent=next?'Ready · night look':'Ready · day look';
};
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>view(b.dataset.view));document.querySelector('#spin').onclick=()=>{controls.autoRotate=!controls.autoRotate};
onresize=()=>{camera.aspect=stage.clientWidth/stage.clientHeight;camera.updateProjectionMatrix();renderer.setSize(stage.clientWidth,stage.clientHeight)};
renderer.setAnimationLoop(now=>{if(blend){const p=Math.min(1,(now-blend.start)/1000);bikeController.setNight(THREE.MathUtils.lerp(blend.from,blend.to,p));if(p===1){night=blend.to;blend=null}}controls.update();renderer.render(scene,camera)});
</script></body></html>
