#covermsg{position:absolute;z-index:1;left:50%;bottom:12%;transform:translateX(-50%);color:#eef3e6;font:600 14px/1.2 system-ui,sans-serif;letter-spacing:.1em;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;gap:12px;white-space:nowrap}
#covermsg::after{content:'';width:180px;height:3px;border-radius:2px;background:linear-gradient(90deg,transparent,#d9ecc0,transparent) no-repeat;background-size:50% 100%;animation:coverbar 1.1s linear infinite}

@media(prefers-reduced-motion:reduce){#covermsg::after{animation:none;background:#d9ecc0}#cover,#coverimg{transition:none}}
