<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Rider pose preview</title>
<style>body{margin:0;background:#c9a27a}canvas{display:block}#bikeStatus{position:absolute;left:10px;top:8px;color:#fff;font:13px system-ui;text-shadow:0 1px 2px #0008}</style>
<script type="importmap">{"imports":{"three":"/dev-game/vendor/three.module.js","three/addons/":"/dev-game/vendor/addons/"}}</script></head>
<body><span id="bikeStatus">Loading…</span><script type="module">
// Isolated chase-camera view of the cleaned bike and rigged mascot (no splats). ?steer=-1..1 holds a steering lean.
import * as THREE from 'three';
import {createCockpit} from '/dev-game/js/cockpit.js';
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);
const steer=+(new URLSearchParams(location.search).get('steer')||0);
const cockpit=createCockpit(renderer);cockpit.ready.then(()=>{document.getElementById('bikeStatus').textContent='Rider ready';});
addEventListener('resize',()=>renderer.setSize(innerWidth,innerHeight));
let prev=performance.now();
const frame=(now)=>{const dt=Math.min(.05,(now-prev)/1000);prev=now;renderer.setClearColor(0xc9a27a);renderer.clear();cockpit.update(dt,steer);cockpit.render(innerWidth/innerHeight);};
renderer.setAnimationLoop(frame);
window.__tick=(n=1,dt=1/30)=>{for(let i=0;i<n;i++){prev-=dt*1000;frame(performance.now());}return renderer.domElement.toDataURL('image/png');};
</script></body></html>
